<title>S.Majestic Rénovation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
:root{
  --bg:#FFFFFF;--tint:#F5F1E8;--surface:#FFFFFF;--ink:#17160F;--ink-2:#5E5A4E;--line:#E6E0D2;--line-2:#CFC8B6;
  --dark:#0D0D0C;--dark-2:#1A1917;--on-dark:#F3F1EC;--silver:#C9C7C1;
  --gold:#A77B22;--gold-2:#CE9D3C;--gold-soft:#F6EAD2;--on-gold:#1A1206;
  --glass:#DCE4E8;--wall:#EFE9DC;--roof:#DCD4C3;--nb:#E9E3D6;--inside:#FCFAF5;--slab:#8E887C;
  --ok:#2E7D4F;--err:#B4431F;
  --sans:"Figtree","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;--r-lg:28px;--r-sm:12px;
  --sh:0 36px 80px -46px rgba(13,13,12,.5);--sh-sm:0 14px 34px -22px rgba(13,13,12,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121310;--tint:#191A16;--surface:#1B1C18;--ink:#F1F1EA;--ink-2:#A5A396;--line:#2D2E28;--line-2:#3F4038;
    --dark:#090908;--dark-2:#141311;--on-dark:#F3F1EC;--silver:#C9C7C1;
    --gold:#D4A95A;--gold-2:#E7C178;--gold-soft:#2B2416;--on-gold:#17120A;
    --glass:#28323A;--wall:#232219;--roof:#2B2A22;--nb:#1E1E19;--inside:#1B1B16;--slab:#6E695F;
    --ok:#5CC08A;--err:#FF7A55;--sh:0 36px 80px -46px rgba(0,0,0,.9);--sh-sm:0 14px 34px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#121310;--tint:#191A16;--surface:#1B1C18;--ink:#F1F1EA;--ink-2:#A5A396;--line:#2D2E28;--line-2:#3F4038;
  --dark:#090908;--dark-2:#141311;--on-dark:#F3F1EC;--silver:#C9C7C1;
  --gold:#D4A95A;--gold-2:#E7C178;--gold-soft:#2B2416;--on-gold:#17120A;
  --glass:#28323A;--wall:#232219;--roof:#2B2A22;--nb:#1E1E19;--inside:#1B1B16;--slab:#6E695F;
  --ok:#5CC08A;--err:#FF7A55;--sh:0 36px 80px -46px rgba(0,0,0,.9);--sh-sm:0 14px 34px -22px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;margin:0 auto;padding-inline:clamp(18px,3.2vw,56px)}

a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em;font-weight:800;line-height:1.08}
h1{font-size:clamp(2.3rem,4.6vw,3.9rem)}
h2{font-size:clamp(1.85rem,3.2vw,2.8rem)}
h3{font-size:1.15rem;letter-spacing:-.015em}
p{margin:0}
.ac{color:var(--gold)}
.lead{color:var(--ink-2);font-size:1.03rem;max-width:34em}

.btn{display:inline-flex;align-items:center;gap:.7em;font-weight:700;font-size:.98rem;line-height:1;padding:.72em .78em .72em 1.3em;border-radius:999px;border:1.5px solid transparent;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,opacity .15s}
.btn .arw{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18)}
.btn .arw svg{width:15px;height:15px}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-dark{background:var(--gold);color:#fff}.btn-dark .arw{background:rgba(0,0,0,.2)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold .arw{background:rgba(0,0,0,.18)}
.btn-line{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
.btn-line .arw{background:var(--gold-soft);color:var(--gold)}
.btn-ghost{border-color:rgba(243,241,236,.4);color:var(--on-dark);background:transparent}
.btn-wa{background:#1FAF55;color:#fff}
.btn-sm{font-size:.9rem;padding:.6em .62em .6em 1.1em}
.btn-sm .arw{width:28px;height:28px}
.alink{display:inline-flex;align-items:center;gap:10px;font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;text-decoration-color:var(--gold)}
.alink svg{width:17px;height:17px}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);font-size:.92rem}
.muted{color:var(--ink-2)}
.leaf{width:16px;height:16px;color:var(--gold);flex:none;margin-top:4px}

/* header */
.util{background:#000;color:var(--on-dark);font-size:.83rem}
.util .wrap{display:flex;gap:24px;align-items:center;height:40px}
.util span{opacity:.8}
.util .demo{margin-left:auto;color:var(--gold-2);opacity:1;font-weight:600}
@media (max-width:900px){.util .hide-m{display:none}.util .wrap{gap:14px}.util .wrap>span:first-child{display:none}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--dark);color:var(--on-dark);border-bottom:1px solid rgba(243,241,236,.12)}
.top .wrap{display:flex;align-items:center;gap:26px;height:92px;position:relative}
.brand{display:flex;align-items:center;gap:6px;text-decoration:none;flex:none}
.logo-img{height:50px;width:auto;display:block;border-radius:6px}
.head-lockup{height:62px;width:auto;display:block}
.brand b{color:var(--on-dark)}
.brand small{color:var(--gold-2)}
.brand svg{width:30px;height:19px;color:var(--gold)}
.brand .nm{display:grid;line-height:1.05}
.brand b{font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.brand small{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2)}
nav.links{display:flex;gap:clamp(12px,1.3vw,24px);font-size:clamp(.86rem,1vw,.95rem);font-weight:600;white-space:nowrap}
nav.links a{text-decoration:none;color:rgba(243,241,236,.82)}
nav.links a:hover{color:var(--gold-2)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid rgba(243,241,236,.3);border-radius:999px;overflow:hidden;font-size:.82rem;font-weight:700}
.lang button{border:0;background:transparent;color:rgba(243,241,236,.7);padding:.45em .75em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:#fff}
.mob-extra{display:none}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(243,241,236,.3);background:transparent;cursor:pointer;place-items:center}
.burger span{display:block;width:18px;height:2px;background:var(--on-dark);box-shadow:0 -6px 0 var(--on-dark),0 6px 0 var(--on-dark)}
@media (max-width:1100px){
  .burger{display:grid}
  nav.links{display:none;position:absolute;top:100%;left:0;right:0;background:var(--dark);flex-direction:column;align-items:flex-start;gap:4px;padding:14px clamp(18px,3.2vw,56px) 22px;border-bottom:1px solid rgba(243,241,236,.14);box-shadow:0 20px 40px -24px rgba(0,0,0,.8)}
  header.top.open nav.links{display:flex}
  nav.links a{font-size:1.02rem;padding-block:10px;width:100%;border-bottom:1px solid rgba(243,241,236,.08)}
  .mob-extra{display:flex;gap:10px;flex-wrap:wrap;padding-top:14px;border:0}
  header.top{position:sticky}
}
@media (max-width:680px){.top .btn{display:none}.top .wrap{height:72px;gap:10px}.logo-img{height:40px}.head-lockup{height:40px}.lang button{padding:.4em .55em}}

/* hero */
.hero{background:var(--dark);color:var(--on-dark);position:relative;overflow:hidden;padding-block:76px 150px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 78% 40%,rgba(206,157,60,.22),transparent 70%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.hero h1{max-width:12em}
.hero p.sub{color:rgba(243,241,236,.78);max-width:32em;margin-top:18px;font-size:1.06rem}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .chk{display:flex;gap:9px;align-items:center;margin-top:22px;color:rgba(243,241,236,.8);font-size:.93rem}
.hero .chk svg{width:17px;height:17px;color:var(--gold-2)}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 30px 50px rgba(0,0,0,.4))}
.hero-chip{position:absolute;left:-18px;top:-22px;background:var(--dark-2);border:1px solid rgba(243,241,236,.16);border-radius:14px;padding:12px 16px;font-size:.85rem;max-width:16em}
.hero-chip b{display:block;color:var(--gold-2);font-size:1rem}
@media (max-width:980px){.hero{padding-block:46px 130px}.hero .wrap{grid-template-columns:1fr;gap:26px}.hero-art{display:none}}

/* configurator card */
.app{margin-top:-110px;padding-bottom:90px;position:relative;z-index:5}
.app-grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(420px,30%,540px);height:clamp(600px,calc(100vh - 150px),840px);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);scroll-margin-top:100px}
@media (max-width:1150px){.app-grid{grid-template-columns:minmax(0,1fr) 395px}}
@media (max-width:900px){.app-grid{grid-template-columns:1fr;height:auto}}
.stage{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--tint)}
@media (max-width:900px){.stage{border-right:0;border-bottom:1px solid var(--line)}}
.house-bar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.house-bar .hb{display:flex;align-items:center;gap:9px;font-size:.85rem;font-weight:600}
.house-bar .hb>span{color:var(--ink-2);font-weight:500}
.mini{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--surface)}
.mini button{border:0;border-left:1px solid var(--line-2);background:transparent;padding:.4em .8em;font-size:.85rem;font-weight:600;cursor:pointer}
.mini button:first-child{border-left:0}
.mini button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
.canvas{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:18px 22px}
@media (max-width:900px){.canvas{min-height:380px}}
.house3d{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.h3d-load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--tint);color:var(--ink-2);font-size:.92rem;text-align:center;padding:24px;z-index:3}
.h3d-load[hidden]{display:none!important}
.h3d-load .spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.h3d-load .spin{animation:none}}
.h3d-load .btn{margin-top:4px}
.rot{position:absolute;right:18px;bottom:16px;display:flex;gap:6px;z-index:2}
.rot button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:1.05rem;line-height:1;box-shadow:var(--sh-sm)}
.rot button:hover{border-color:var(--gold)}
.hint{position:absolute;left:20px;top:16px;display:inline-flex;align-items:center;gap:9px;font-size:.87rem;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.42em .95em;box-shadow:var(--sh-sm);z-index:2}
.hint i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.view{position:absolute;right:20px;top:18px;font-size:.78rem;color:var(--ink-2);font-family:var(--mono);z-index:2}
@media (max-width:760px){.view{display:none}.hint{left:14px;top:12px;font-size:.8rem}}
.stage-foot{display:flex;gap:18px;flex-wrap:wrap;padding:11px 20px;border-top:1px solid var(--line);font-size:.83rem;color:var(--ink-2);min-height:42px;align-items:center}
.stage-foot span{display:inline-flex;align-items:center;gap:6px}
.stage-foot i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line-2)}
.house .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.house .thin{stroke:var(--ink-2);stroke-width:.8;fill:none}
.house .wall{fill:var(--wall);stroke:var(--ink);stroke-width:1.4}
.house .roof{fill:var(--roof);stroke:var(--ink);stroke-width:1.4}
.house .nb{fill:var(--nb);stroke:var(--ink-2);stroke-width:.8}
.house .dim{stroke:var(--ink-2);stroke-width:.8}
.house text{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.house .gl{fill:var(--glass);transition:fill .2s}
.op{cursor:pointer}
.op .fr{transition:fill .3s}
.op:hover .gl{fill:var(--gold-soft)}
.op.on .gl{fill:var(--gold-soft)}
.op .sel{fill:none;stroke:var(--gold);stroke-width:2.4;opacity:0;transition:opacity .2s}
.op.on .sel{opacity:1}
.op .ck{opacity:0;transition:opacity .2s}
.op.on .ck{opacity:1}
.ck rect{fill:var(--gold)}.ck text{fill:#fff;font-size:10px;font-family:var(--sans);font-weight:800}
.zhit{cursor:pointer;fill:transparent}
.zfill{fill:url(#hatch);pointer-events:none}
.lbl rect{fill:var(--gold)}.lbl text{fill:#fff;font-weight:600}
.sp{fill:#1E2A3A;stroke:#8FA3B8;stroke-width:.7}
.sp-slot{fill:transparent;stroke:var(--ink-2);stroke-width:.7;stroke-dasharray:3 3;opacity:.6}
.room{cursor:pointer}
.room .rf{fill:var(--inside);transition:fill .2s}
.room:hover .rf{fill:var(--gold-soft)}
.room.on .rf{fill:var(--gold-soft)}
.room text{font-family:var(--sans);font-size:12.5px;fill:var(--ink);font-weight:600}
.room .unit{opacity:0;transition:opacity .2s}
.room.on .unit{opacity:1}
.unit rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.unit path{stroke:var(--gold);stroke-width:1.3;fill:none}

.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;border-left:1px solid var(--line);background:transparent;padding:14px 2px 12px;font-size:.72rem;font-weight:700;cursor:pointer;color:var(--ink-2);position:relative;min-width:0}
.tab span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.has{color:var(--gold)}
@media (max-width:560px){.tabs .tab{font-size:.65rem;padding:12px 1px 10px}.tabs .tab svg{width:18px;height:18px}.tab .dot{right:calc(50% - 22px);width:6px;height:6px}}
.tab .dot{position:absolute;top:8px;right:calc(50% - 26px);width:7px;height:7px;border-radius:50%;background:var(--gold)}
/* panier : total cumulé entre les services */
.cart{display:grid;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.cart .ci{display:flex;align-items:center;gap:8px;font-size:.86rem}
.cart .ci .nm2{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cart .ci .am{font-variant-numeric:tabular-nums;font-weight:700}
.cart .ci .rm{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);background:transparent;cursor:pointer;line-height:1;font-size:.8rem;color:var(--ink-2);flex:none}
.cart .ci .rm:hover{border-color:var(--err);color:var(--err)}
.tab:first-child{border-left:0}
.tab svg{width:20px;height:20px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--dark);background:var(--tint)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold)}
.pbody{flex:1;min-height:0;overflow:auto;padding:20px 24px;display:grid;gap:20px;align-content:start}
.pbody h2{font-size:1.38rem}
.pbody .sub{color:var(--ink-2);font-size:.92rem;margin-top:5px}
.types{display:grid}
.type{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.type .nm{font-size:.96rem;font-weight:600}
.type .ex{font-size:.79rem;color:var(--ink-2)}
.type.on .nm{font-weight:800}
.stp{display:flex;align-items:center;gap:3px}
.stp button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:1.05rem;line-height:1;font-weight:700}
.stp button:hover{border-color:var(--gold)}
.stp button:disabled{opacity:.3;cursor:default;border-color:var(--line)}
.stp output{min-width:30px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.grp{display:grid;gap:8px}
.grp>.gl{font-weight:700;font-size:.92rem}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:.48em .9em;font-size:.88rem;font-weight:600;cursor:pointer}
.seg button:hover{border-color:var(--gold)}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.seg button.q{border-style:dashed;color:var(--ink-2)}
.seg button.q[aria-pressed="true"]{border-style:solid;color:var(--on-dark)}
.grp .why{font-size:.81rem;color:var(--ink-2)}
.grp .why b{color:var(--gold);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;font-weight:600;padding:.28em .75em;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.empty{font-size:.86rem;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:12px;padding:11px 13px}
.note{font-size:.82rem;color:var(--ink-2);border-left:2px solid var(--gold);padding-left:11px}
.calcdet{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--tint)}
.calcdet summary{font-size:.88rem;font-weight:700;cursor:pointer}
.calcdet ul{list-style:none;margin:10px 0 0;padding:0;display:grid}
.calcdet li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.calcdet li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.calcdet li.tot{font-weight:800;border-bottom:0}
.calcdet li .d{display:block;color:var(--ink-2);font-size:.76rem;font-weight:400}
.price{border-top:1px solid var(--line);padding:18px 24px 20px;display:grid;gap:12px;background:var(--surface)}
.price .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.price .lbl2{font-size:.82rem;color:var(--ink-2);font-weight:600}
.pv{font-weight:800;font-size:2.25rem;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums;transition:color .3s;white-space:nowrap}
@media (max-width:560px){.price .row1{flex-direction:column;align-items:flex-start;gap:4px}.price .row1 .pmeta{text-align:left}.pv{font-size:2rem}}
.pv small{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.pv.pulse{color:var(--gold)}
.pmeta{font-size:.78rem;color:var(--ink-2);text-align:right;line-height:1.45;min-width:0}
.price .acts{display:flex;gap:9px}
.price .acts .btn{flex:1;justify-content:center;white-space:normal;min-width:0;text-align:center;padding-inline:1.1em}
.price .acts .btn .arw{display:none}
.lead-f,.lead2{display:grid;gap:10px}
.lead .row{display:grid;grid-template-columns:1fr 1fr .7fr;gap:9px}
@media (max-width:480px){.lead .row{grid-template-columns:1fr}}
.field{display:grid;gap:4px}
.field label{font-size:.8rem;color:var(--ink-2);font-weight:600}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;font:inherit;font-size:.96rem;color:var(--ink);background:var(--tint);border:1px solid var(--line-2);border-radius:12px;padding:.72em .9em}
